# Server
server.port=8080

# PostgreSQL - Users, Roles, Policies
spring.datasource.url=jdbc:postgresql://localhost:5432/zerotrust_db1
spring.datasource.username=postgres
spring.datasource.password=Sonuu@223
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MongoDB - API Logs, Behavior Analytics, Threats
spring.data.mongodb.uri=mongodb://localhost:27017/zerotrust_logs
spring.data.mongodb.database=zerotrust_logs

# JWT
jwt.secret=ZeroTrustSecretKey2024VeryLongSecretKeyForHMACSHA256Algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Rate Limiting
rate.limit.requests-per-minute=60
rate.limit.burst-capacity=100

# ML Threat Detection Service (Python/Flask)
ml.service.url=http://localhost:5001

# CORS
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.zerotrust=DEBUG
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics